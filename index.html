@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap');
:root{--hero:none}
*{box-sizing:border-box}body{margin:0;font:15px Arial,sans-serif;color:#24364b;background:#eef9f2}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,rgba(3,40,25,.50),rgba(3,40,25,.30)),var(--hero) center/cover fixed}
.login-shell{width:min(900px,94vw);background:#fff;box-shadow:0 16px 50px #061b4055;border-radius:3px;overflow:hidden}
.login-brand{padding:18px 24px;background:#fff;color:#0b5d3b;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:clamp(18px,3vw,27px);font-weight:bold}
.login-brand small{display:block;color:#278a4e;font-size:12px;margin-top:4px}
.login-body{display:grid;grid-template-columns:1.15fr .85fr;min-height:300px}
.login-picture{background:linear-gradient(90deg,#062d65aa,#0786b855),var(--hero) center/cover;min-height:280px}
.login-form{background:#37966d;color:white;padding:22px 25px;text-align:center}
.login-form input{width:100%;margin:9px 0;background:white;color:#14253b}
.login-form button{background:#0b5d3b;color:#fff;min-width:110px}
.login-footer{text-align:center;padding:15px;color:#31506b;font-size:12px}
.wrap{max-width:1500px;margin:0 auto;padding:0}
#app{max-width:none}
.system-banner{height:70px;background:linear-gradient(90deg,#fffF 0%,#fffE 62%,#fff8 100%),var(--hero) center 43%/cover;display:flex;align-items:center;padding:8px 18px;color:#0b5d3b;font-size:clamp(17px,2vw,24px);font-weight:bold}
.system-banner small{display:block;color:#23844c;font-size:12px;font-weight:normal}
.topbar{background:#087342;color:#ffdf31;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 18px;flex-wrap:wrap}
.workspace{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:calc(100vh - 125px);background:#fff}
.sidebar{background:#0b5d3b;color:#fff;padding:12px 15px}
